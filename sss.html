  <!-- Template section -->
      <section class="bg-transparent flex md:grid grid-cols-14 gap-px w-full">
        <div class="max-md:w-4 md:col-span-1 bg-white max-2xl:rounded-r-10px"></div>
        <!-- main-container  -->
        <div class="w-full col-span-12 bg-Theme-bg 2xl:grid 2xl:grid-cols-15 gap-px">
          <div class="col-span-2 bg-white rounded-r-10px max-2xl:hidden"></div>
          <!-- place content here -->
          <div
            class="col-span-11 bg-Theme-bg rounded-10px w-full flex items-center justify-center flex-col gap-px h-full bg-Theme-bg"
          >
            <div class="bg-white rounded-10px pt-28 pb-16 px-6 text-center w-full">
              <h2
                class="text-[38px] leading-[48px] tracking-[-0.76px] font-Inter-disp text-Theme-Black"
              >
                Start faster with ready-made templates
              </h2>

              <p class="mt-4 text-base leading-6 text-[#8C8484]">
                Explore thoughtfully designed templates for common use cases, ready to use and easy
                to customize.
              </p>
            </div>

            <!-- tab function  -->
            <!-- WRAPPER -->
            <div
              x-data="{
              activeTab1: 'Lead',
              tabWorkspaces: {
                Lead: 'Lead generation',
                Marketing: 'Marketing',
                Surveys: 'Surveys',
                Registrations: 'Registrations',
                Quizzes: 'Quizzes',
              },
              templates: [],
              isLoadingTemplates: true,
              templatesError: '',
              latestTime(template) {
                const rawDate = template.createdAt || template.created_at || template.updatedAt || template.updated_at || template.publishedAt || template.published_at || template.date || '';
                const parsedDate = rawDate ? Date.parse(rawDate) : 0;

                return Number.isNaN(parsedDate) ? 0 : parsedDate;
              },
              latestTemplates(templates) {
                return [...templates]
                  .sort((a, b) => this.latestTime(b) - this.latestTime(a))
                  .slice(0, 6);
              },
              templateUrl(template) {
                const titleSlug = (template.slug)
                  .trim();
                 
                return `/templates/${titleSlug}`;
              },
              async loadTemplates() {
                this.isLoadingTemplates = true;
                this.templatesError = '';

                try {
                  const params = new URLSearchParams({
                    workspaceName: this.tabWorkspaces[this.activeTab1],
                    limit: '1000',
                  });
                  const response = await fetch(`https://kiwiform.com/api/templates?${params.toString()}`);
                  const result = await response.json();

                  if (!response.ok || !result.success) {
                    throw new Error(result.message || 'Unable to load templates.');
                  }

                  this.templates = Array.isArray(result.data) ? this.latestTemplates(result.data) : [];
                } catch (error) {
                  this.templatesError = error.message || 'Unable to load templates.';
                } finally {
                  this.isLoadingTemplates = false;
                }
              },
            }"
              x-init="$watch('activeTab1', () => loadTemplates()); loadTemplates()"
              class="relative w-full flex flex-col gap-px"
            >
              <!-- TABS -->
              <div
                class="grid grid-cols-1 sm:grid-cols-2 lg:flex items-center justify-center flex-row lg:p-[2px] gap-px bg-Theme-bg rounded-10px lg:absolute lg:-top-[22px] lg:left-1/2 lg:-translate-x-1/2 w-full lg:max-w-[804px]"
              >
                <div class="absolute -left-[8px] top-[12.5px] hidden lg:block">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="8"
                    height="17"
                    fill="none"
                    overflow="visible"
                  >
                    <path
                      d="M 8 0 C 8 4.418 4.418 8 0 8 L 8 8 Z M 0 8 L 8 8 L 8 9 L 0 9 Z M 8 17 C 8 12.582 4.418 9 0 9 L 8 9 Z"
                      fill="rgb(226,220,220)"
                    ></path>
                  </svg>
                </div>
                <div class="absolute -right-[8px] top-[12.5px] hidden lg:block">
                  <svg
                    xmlns="http://www.w3.org/2000/svg"
                    width="8"
                    height="17"
                    fill="none"
                    overflow="visible"
                  >
                    <path
                      d="M 0 0 C 0 4.418 3.582 8 8 8 L 0 8 Z M 8 8 L 0 8 L 0 9 L 8 9 Z M 0 17 C 0 12.582 3.582 9 8 9 L 0 9 Z"
                      fill="rgb(226,220,220)"
                    ></path>
                  </svg>
                </div>
                <!-- TAB -->
                <button
                  @click="activeTab1 = 'Lead'"
                  class="relative w-full flex py-2.5 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-300"
                  :class="activeTab1 === 'Lead'
          ? 'bg-white text-[#007D47] shadow-[0_1px_2px_rgba(0,0,0,0.05)]'
          : 'text-[#6f6767] max-lg:bg-white hover:text-[#222]'"
                >
                  Lead Generation
                </button>

                <!-- TAB -->
                <button
                  @click="activeTab1 = 'Marketing'"
                  class="relative w-full flex py-2.5 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-300"
                  :class="activeTab1 === 'Marketing'
          ? 'bg-white text-[#007D47] shadow-[0_1px_2px_rgba(0,0,0,0.05)]'
          : 'text-[#6f6767] max-lg:bg-white hover:text-[#222]'"
                >
                  Marketing
                </button>

                <!-- TAB -->
                <button
                  @click="activeTab1 = 'Surveys'"
                  class="relative w-full flex py-2.5 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-300"
                  :class="activeTab1 === 'Surveys'
          ? 'bg-white text-[#007D47] shadow-[0_1px_2px_rgba(0,0,0,0.05)]'
          : 'text-[#6f6767] max-lg:bg-white hover:text-[#222]'"
                >
                  Surveys
                </button>

                <!-- TAB -->
                <button
                  @click="activeTab1 = 'Registrations'"
                  class="relative w-full flex py-2.5 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-300"
                  :class="activeTab1 === 'Registrations'
          ? 'bg-white text-[#007D47] shadow-[0_1px_2px_rgba(0,0,0,0.05)]'
          : 'text-[#6f6767] max-lg:bg-white hover:text-[#222]'"
                >
                  Registrations
                </button>

                <!-- TAB -->
                <button
                  @click="activeTab1 = 'Quizzes'"
                  class="relative w-full flex py-2.5 flex items-center justify-center rounded-lg text-sm font-medium transition-all duration-300 sm:col-span-2"
                  :class="activeTab1 === 'Quizzes'
          ? 'bg-white text-[#007D47] shadow-[0_1px_2px_rgba(0,0,0,0.05)]'
          : 'text-[#6f6767] max-lg:bg-white hover:text-[#222]'"
                >
                  Quizzes
                </button>
              </div>
              <div class="bg-white rounded-10px w-fill h-[46px]"></div>
              <!-- CONTENT -->
              <div class="">
                <!-- Dynamic template cards -->
                <div
                  class="overflow-hidden rounded-10px bg-Theme-bg grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-px"
                >
                  <template x-if="isLoadingTemplates">
                    <div class="p-[22px] pb-8 rounded-10px bg-white md:col-span-2 lg:col-span-3">
                      <p class="text-sm leading-5 text-[#8C8484]">Loading templates...</p>
                    </div>
                  </template>

                  <template x-if="!isLoadingTemplates && templatesError">
                    <div class="p-[22px] pb-8 rounded-10px bg-white md:col-span-2 lg:col-span-3">
                      <p class="text-sm leading-5 text-[#8C8484]" x-text="templatesError"></p>
                    </div>
                  </template>

                  <template x-if="!isLoadingTemplates && !templatesError && templates.length === 0">
                    <div class="p-[22px] pb-8 rounded-10px bg-white md:col-span-2 lg:col-span-3">
                      <p class="text-sm leading-5 text-[#8C8484]">No templates found.</p>
                    </div>
                  </template>

                  <template x-for="template in templates" :key="template.id">
                    <a
                      class="group block p-[22px] pb-8 rounded-10px bg-white transition-all duration-300 hover:shadow-[0_16px_32px_rgba(24,60,26,0.08)]"
                      :href="templateUrl(template)"
                    >
                      <div class="overflow-hidden rounded-lg">
                        <img
                          class="w-full object-cover transition-transform duration-300 group-hover:scale-[1.05]"
                          :src="template.thumbnail"
                          :alt="`${template.title} template poster image`"
                        />
                      </div>
                      <h5
                        class="mt-5 mb-2 text-base leading-5 font-medium text-Theme-Black capitalize"
                        x-text="template.title"
                      ></h5>
                      <p
                        class="text-sm leading-5 text-[#8C8484] line-clamp-2"
                        x-text="template.description || 'Explore this ready-made template and customize it for your workflow.'"
                      ></p>
                    </a>
                  </template>
                </div>
              </div>

              <div
                class="bg-white rounded-10px w-fill h-[120px] flex items-center justify-center relative overflow-visible"
              >
                <a href="/templates" class="btn-kiwi-green w-max px-6 rounded-lg">
                  Browse Templates
                </a>
              </div>
            </div>
          </div>
          <div class="col-span-2 bg-white rounded-l-10px max-2xl:hidden"></div>
        </div>
        <div class="max-md:w-4 md:col-span-1 bg-white max-2xl:rounded-l-10px"></div>
      </section>
